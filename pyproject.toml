[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-agent"
version = "0.1.0"
description = "A LangChain SQL question-answering agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.0.0,<2.0.0",
    "langchain-community>=0.4.0,<1.0.0",
    "langchain-google-genai>=4.0.0,<5.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "streamlit>=1.40.0,<2.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0,<9.0.0"]

[project.scripts]
sql-agent = "sql_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
